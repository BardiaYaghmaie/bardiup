# =============================================================================
# USE CASE: Disaster Recovery Setup
# =============================================================================
#
# Scenario: Cross-region disaster recovery with RTO/RPO requirements
#
# Requirements:
# - RPO (Recovery Point Objective): 1 hour - max data loss acceptable
# - RTO (Recovery Time Objective): 4 hours - max time to recover
# - Cross-region backup storage for geographic redundancy
# - Quick identification of most recent valid backup
#
# Architecture:
# - Primary: us-east-1
# - DR: us-west-2 (S3 bucket with cross-region replication)
#
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: dr-s3-credentials
  namespace: critical-apps
type: Opaque
stringData:
  accessKeyId: "REPLACE_WITH_YOUR_ACCESS_KEY"
  secretAccessKey: "REPLACE_WITH_YOUR_SECRET_KEY"
---
apiVersion: bardiup.io/v1alpha1
kind: BackupConfig
metadata:
  name: disaster-recovery-primary
  namespace: critical-apps
  labels:
    backup-strategy: disaster-recovery
    region: us-east-1
    rpo: 1h
  annotations:
    description: "Primary DR backup - 1 hour RPO"
    runbook: "https://wiki.company.com/dr-procedures"
    escalation: "oncall-infrastructure@company.com"
spec:
  pvcSelector:
    namespace: critical-apps
    matchLabels:
      dr-enabled: "true"

  # Hourly backups to meet 1-hour RPO
  schedule: "0 * * * *"

  backupMethod: copy

  storageBackend:
    type: s3
    prefix: dr/critical-apps
    s3:
      # Primary bucket - enable cross-region replication to us-west-2
      bucket: company-dr-primary-us-east-1
      region: us-east-1
      credentialsSecret: dr-s3-credentials

  retentionPolicy:
    # 48 hourly backups (2 days of granular recovery)
    daily:
      keep: 48
      selectionStrategy: newest

    # 7 daily backups
    weekly:
      keep: 7
      selectionStrategy: distributed

    # 4 weekly backups
    monthly:
      keep: 4
      selectionStrategy: distributed

    # 12 monthly backups
    yearly:
      keep: 12
      selectionStrategy: distributed
---
# =============================================================================
# DR Recovery Checklist (as ConfigMap for documentation)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: dr-recovery-checklist
  namespace: critical-apps
  labels:
    backup-strategy: disaster-recovery
data:
  recovery-procedure.md: |
    # Disaster Recovery Procedure

    ## Prerequisites
    - Access to DR region (us-west-2)
    - kubectl configured for DR cluster
    - S3 credentials for DR bucket

    ## Recovery Steps

    ### 1. Assess the Situation (15 min)
    ```bash
    # Check primary region status
    kubectl get nodes --context=primary-cluster
    
    # If primary is down, proceed to failover
    ```

    ### 2. Activate DR Cluster (30 min)
    ```bash
    # Switch to DR cluster context
    kubectl config use-context dr-cluster
    
    # Verify DR cluster is healthy
    kubectl get nodes
    kubectl get pods -n kube-system
    ```

    ### 3. Identify Latest Backup (15 min)
    ```bash
    # List available backups in DR bucket
    aws s3 ls s3://company-dr-replica-us-west-2/dr/critical-apps/ \
      --region us-west-2 --recursive | sort -k1,2 | tail -20
    
    # Or check Backup resources if they were replicated
    kubectl get backups -n critical-apps --sort-by=.status.completionTime
    ```

    ### 4. Create Target PVCs (15 min)
    ```bash
    # Apply PVC manifests (should be in version control)
    kubectl apply -f infrastructure/pvcs/critical-apps/
    ```

    ### 5. Run Restore Jobs (1-2 hours depending on data size)
    ```bash
    # For each critical PVC, run restore job
    # See examples in docs/RESTORE_GUIDE.md
    
    kubectl apply -f restore-jobs/
    kubectl wait --for=condition=complete job -l restore-batch=dr-20251203 -n critical-apps --timeout=2h
    ```

    ### 6. Verify Data Integrity (30 min)
    ```bash
    # Run application-specific verification
    kubectl exec -it deploy/app-primary -n critical-apps -- /verify-data.sh
    ```

    ### 7. Update DNS/Traffic (15 min)
    ```bash
    # Update Route53 or your DNS provider
    # Redirect traffic to DR region
    ```

    ### 8. Monitor and Validate (ongoing)
    ```bash
    # Watch application logs
    kubectl logs -f deploy/app-primary -n critical-apps
    
    # Check metrics
    # Verify customer-facing functionality
    ```

    ## Post-Recovery
    - Document timeline and actions taken
    - Conduct post-mortem
    - Plan primary region recovery
    - Update runbooks based on lessons learned

  rpo-rto-targets.yaml: |
    # Recovery Objectives
    applications:
      critical-apps:
        rpo: 1h    # Max 1 hour of data loss
        rto: 4h    # Recover within 4 hours
        backup_frequency: hourly
        
      standard-apps:
        rpo: 24h   # Max 1 day of data loss
        rto: 24h   # Recover within 1 day
        backup_frequency: daily
        
      dev-apps:
        rpo: 7d    # Max 1 week of data loss
        rto: 48h   # Recover within 2 days
        backup_frequency: weekly

