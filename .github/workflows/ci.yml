name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: make generate manifests && git diff --exit-code
      - name: Lint
        run: make lint
      - name: Unit and integration tests
        run: make test
      - name: Fuzz
        run: make fuzz
      - name: Helm lint
        run: helm lint charts/bardiup --strict
      - name: Shellcheck
        run: shellcheck -x hack/*.sh

  e2e:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e
          - name: e2e (snapshot)
            snapshot: "1"
          - name: e2e (Kubernetes 1.27)
            kind: v0.24.0
            image: kindest/node:v1.27.16@sha256:3fd82731af34efe19cd54ea5c25e882985bafa2c9baefe14f8deab1737d9fabe
            kubectl: v1.28.15
          - name: e2e (arm64)
            runner: ubuntu-24.04-arm
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-kubectl@v5
        with:
          version: ${{ matrix.kubectl || 'latest' }}
      - uses: azure/setup-helm@v5
      - run: go install sigs.k8s.io/kind@${{ matrix.kind || 'v0.33.0' }}
      - run: ./hack/e2e.sh
        env:
          E2E_SNAPSHOT: ${{ matrix.snapshot }}
          KIND_IMAGE: ${{ matrix.image }}

  stress:
    # Runs on merges into main and on demand, not on pull requests.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: ./hack/stress.sh
