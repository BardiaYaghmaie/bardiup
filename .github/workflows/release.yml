name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/bardiayaghmaie/bardiup
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Lightweight namespace-scoped PVC backups with GFS retention
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: azure/setup-helm@v5
      - name: Package and push chart
        run: |
          helm package charts/bardiup --version "${{ steps.v.outputs.version }}" --app-version "${{ steps.v.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "bardiup-${{ steps.v.outputs.version }}.tgz" oci://ghcr.io/bardiayaghmaie/charts
      - name: Install manifest
        run: make install-manifest VERSION=${{ github.ref_name }}
      - name: Release notes
        run: awk -v v="## [${{ steps.v.outputs.version }}]" '$0 ~ "^## \\[" { p = index($0, v) == 1; next } p' CHANGELOG.md > notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/bardiup.yaml "bardiup-${{ steps.v.outputs.version }}.tgz" \
            --title "${{ github.ref_name }}" --notes-file notes.md
