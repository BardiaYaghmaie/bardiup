{{- $role := .Files.Get "files/role.yaml" | fromYaml }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bardiup.fullname" . }}
  labels: {{- include "bardiup.labels" . | nindent 4 }}
rules: {{- toYaml $role.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bardiup.fullname" . }}
  labels: {{- include "bardiup.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bardiup.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bardiup.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bardiup.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "bardiup.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bardiup.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "bardiup.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bardiup.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "bardiup.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.aggregateToDefaultRoles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bardiup.fullname" . }}-edit
  labels:
    {{- include "bardiup.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: ["bardiup.io"]
    resources: ["backupconfigs", "backups", "restores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bardiup.fullname" . }}-view
  labels:
    {{- include "bardiup.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["bardiup.io"]
    resources: ["backupconfigs", "backups", "restores"]
    verbs: ["get", "list", "watch"]
{{- end }}
