---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: restores.bardiup.io
spec:
  group: bardiup.io
  names:
    categories:
    - bardiup
    kind: Restore
    listKind: RestoreList
    plural: restores
    shortNames:
    - rst
    singular: restore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backupName
      name: Backup
      type: string
    - jsonPath: .spec.source.objectKey
      name: Source
      priority: 1
      type: string
    - jsonPath: .spec.target.pvcName
      name: Target PVC
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Restore extracts a Backup into a new or existing PVC.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RestoreSpec restores backup data into a PVC.
            properties:
              backupName:
                description: BackupName is a Completed Backup in the Restore's namespace.
                type: string
                x-kubernetes-validations:
                - message: backupName is immutable
                  rule: self == oldSelf
              job:
                description: Job customises the data mover Job.
                properties:
                  activeDeadlineSeconds:
                    default: 21600
                    description: ActiveDeadlineSeconds bounds how long a single backup
                      or restore may run.
                    format: int64
                    minimum: 60
                    type: integer
                  backoffLimit:
                    default: 2
                    description: BackoffLimit is the number of retries before the
                      Job is marked failed.
                    format: int32
                    minimum: 0
                    type: integer
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector for the mover pod. Ignored when the
                      pod must run next to a workload holding a ReadWriteOnce volume.
                    type: object
                  resources:
                    description: Resources for the data mover container.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  securityContext:
                    description: |-
                      SecurityContext replaces the default container security context.
                      By default the mover runs as root with only DAC_OVERRIDE (backup) or
                      CHOWN/DAC_OVERRIDE/FOWNER/FSETID (restore), which satisfies the "baseline" Pod Security Standard.
                    properties:
                      allowPrivilegeEscalation:
                        description: |-
                          AllowPrivilegeEscalation controls whether a process can gain more
                          privileges than its parent process. This bool directly controls if
                          the no_new_privs flag will be set on the container process.
                          AllowPrivilegeEscalation is true always when the container is:
                          1) run as Privileged
                          2) has CAP_SYS_ADMIN
                          Note that this field cannot be set when spec.os.name is windows.
                        type: boolean
                      appArmorProfile:
                        description: |-
                          appArmorProfile is the AppArmor options to use by this container. If set, this profile
                          overrides the pod's appArmorProfile.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          localhostProfile:
                            description: |-
                              localhostProfile indicates a profile loaded on the node that should be used.
                              The profile must be preconfigured on the node to work.
                              Must match the loaded name of the profile.
                              Must be set if and only if type is "Localhost".
                            type: string
                          type:
                            description: |-
                              type indicates which kind of AppArmor profile will be applied.
                              Valid options are:
                                Localhost - a profile pre-loaded on the node.
                                RuntimeDefault - the container runtime's default profile.
                                Unconfined - no AppArmor enforcement.
                            type: string
                        required:
                        - type
                        type: object
                      capabilities:
                        description: |-
                          The capabilities to add/drop when running containers.
                          Defaults to the default set of capabilities granted by the container runtime.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          add:
                            description: Added capabilities
                            items:
                              description: Capability represent POSIX capabilities
                                type
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          drop:
                            description: Removed capabilities
                            items:
                              description: Capability represent POSIX capabilities
                                type
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        type: object
                      privileged:
                        description: |-
                          Run container in privileged mode.
                          Processes in privileged containers are essentially equivalent to root on the host.
                          Defaults to false.
                          Note that this field cannot be set when spec.os.name is windows.
                        type: boolean
                      procMount:
                        description: |-
                          procMount denotes the type of proc mount to use for the containers.
                          The default value is Default which uses the container runtime defaults for
                          readonly paths and masked paths.
                          Note that this field cannot be set when spec.os.name is windows.
                        type: string
                      readOnlyRootFilesystem:
                        description: |-
                          Whether this container has a read-only root filesystem.
                          Default is false.
                          Note that this field cannot be set when spec.os.name is windows.
                        type: boolean
                      runAsGroup:
                        description: |-
                          The GID to run the entrypoint of the container process.
                          Uses runtime default if unset.
                          May also be set in PodSecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      runAsNonRoot:
                        description: |-
                          Indicates that the container must run as a non-root user.
                          If true, the Kubelet will validate the image at runtime to ensure that it
                          does not run as UID 0 (root) and fail to start the container if it does.
                          If unset or false, no such validation will be performed.
                          May also be set in PodSecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                        type: boolean
                      runAsUser:
                        description: |-
                          The UID to run the entrypoint of the container process.
                          Defaults to user specified in image metadata if unspecified.
                          May also be set in PodSecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      seLinuxOptions:
                        description: |-
                          The SELinux context to be applied to the container.
                          If unspecified, the container runtime will allocate a random SELinux context for each
                          container.  May also be set in PodSecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          level:
                            description: Level is SELinux level label that applies
                              to the container.
                            type: string
                          role:
                            description: Role is a SELinux role label that applies
                              to the container.
                            type: string
                          type:
                            description: Type is a SELinux type label that applies
                              to the container.
                            type: string
                          user:
                            description: User is a SELinux user label that applies
                              to the container.
                            type: string
                        type: object
                      seccompProfile:
                        description: |-
                          The seccomp options to use by this container. If seccomp options are
                          provided at both the pod & container level, the container options
                          override the pod options.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          localhostProfile:
                            description: |-
                              localhostProfile indicates a profile defined in a file on the node should be used.
                              The profile must be preconfigured on the node to work.
                              Must be a descending path, relative to the kubelet's configured seccomp profile location.
                              Must be set if type is "Localhost". Must NOT be set for any other type.
                            type: string
                          type:
                            description: |-
                              type indicates which kind of seccomp profile will be applied.
                              Valid options are:

                              Localhost - a profile defined in a file on the node should be used.
                              RuntimeDefault - the container runtime default profile should be used.
                              Unconfined - no profile should be applied.
                            type: string
                        required:
                        - type
                        type: object
                      windowsOptions:
                        description: |-
                          The Windows specific settings applied to all containers.
                          If unspecified, the options from the PodSecurityContext will be used.
                          If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is linux.
                        properties:
                          gmsaCredentialSpec:
                            description: |-
                              GMSACredentialSpec is where the GMSA admission webhook
                              (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the
                              GMSA credential spec named by the GMSACredentialSpecName field.
                            type: string
                          gmsaCredentialSpecName:
                            description: GMSACredentialSpecName is the name of the
                              GMSA credential spec to use.
                            type: string
                          hostProcess:
                            description: |-
                              HostProcess determines if a container should be run as a 'Host Process' container.
                              All of a Pod's containers must have the same effective HostProcess value
                              (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers).
                              In addition, if HostProcess is true then HostNetwork must also be set to true.
                            type: boolean
                          runAsUserName:
                            description: |-
                              The UserName in Windows to run the entrypoint of the container process.
                              Defaults to the user specified in image metadata if unspecified.
                              May also be set in PodSecurityContext. If set in both SecurityContext and
                              PodSecurityContext, the value specified in SecurityContext takes precedence.
                            type: string
                        type: object
                    type: object
                  serviceAccountName:
                    description: ServiceAccountName for the mover pod, e.g. one bound
                      to an IAM role via IRSA.
                    type: string
                  tolerations:
                    description: Tolerations added to the mover pod.
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                type: object
              source:
                description: |-
                  Source restores straight from an archive in object storage, without a Backup object.
                  Use it for disaster recovery into a new cluster or namespace.
                properties:
                  objectKey:
                    description: |-
                      ObjectKey of the .tar.gz archive, e.g. prod/postgres/data-postgres-0/nightly-data-postgres-0-20261119-020000.tar.gz.
                      If <objectKey>.json exists, its checksum is verified.
                    minLength: 1
                    type: string
                  storage:
                    description: Storage holding the archive. The credentials Secret
                      must exist in the Restore's namespace.
                    properties:
                      s3:
                        description: S3 configures an S3 or S3-compatible bucket (AWS,
                          MinIO, Ceph RGW, Cloudflare R2, Backblaze B2, Wasabi, ...).
                        properties:
                          bucket:
                            description: Bucket name. It must already exist.
                            minLength: 3
                            type: string
                          credentialsSecretRef:
                            description: |-
                              CredentialsSecretRef names a Secret in the same namespace holding AWS_ACCESS_KEY_ID,
                              AWS_SECRET_ACCESS_KEY and optionally AWS_SESSION_TOKEN.
                              When omitted, the default AWS credential chain is used (IRSA, EKS Pod Identity, instance profile).
                            properties:
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                            type: object
                            x-kubernetes-map-type: atomic
                          endpoint:
                            description: |-
                              Endpoint URL for S3-compatible storage, e.g. https://minio.example.com:9000.
                              Leave empty for AWS S3.
                            type: string
                          forcePathStyle:
                            description: ForcePathStyle uses path-style addressing
                              (bucket in the path). Required by most self-hosted stores
                              like MinIO.
                            type: boolean
                          insecureSkipTLSVerify:
                            description: InsecureSkipTLSVerify disables TLS certificate
                              verification. Only for testing.
                            type: boolean
                          kmsKeyID:
                            description: KMSKeyID is the KMS key used when serverSideEncryption
                              is aws:kms.
                            type: string
                          prefix:
                            description: |-
                              Prefix prepended to every object key. Objects are stored as
                              <prefix>/<namespace>/<pvc>/<backup>.tar.gz plus a .json manifest.
                            type: string
                          region:
                            default: us-east-1
                            description: Region of the bucket. Most S3-compatible
                              stores accept any value.
                            type: string
                          serverSideEncryption:
                            description: ServerSideEncryption requests server-side
                              encryption of stored objects.
                            enum:
                            - AES256
                            - aws:kms
                            type: string
                        required:
                        - bucket
                        type: object
                    required:
                    - s3
                    type: object
                required:
                - objectKey
                - storage
                type: object
                x-kubernetes-validations:
                - message: source is immutable
                  rule: self == oldSelf
              target:
                description: Target is the PVC receiving the data.
                properties:
                  accessModes:
                    description: AccessModes for a newly created PVC.
                    items:
                      type: string
                    type: array
                  cleanTarget:
                    description: |-
                      CleanTarget deletes all existing content of the target volume before extracting.
                      Without it, restored files overwrite existing ones and unrelated files are left in place.
                    type: boolean
                  pvcName:
                    description: PVCName of the destination PVC in the Restore's namespace.
                    minLength: 1
                    type: string
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Size for a newly created PVC.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: StorageClassName for a newly created PVC.
                    type: string
                required:
                - pvcName
                type: object
                x-kubernetes-validations:
                - message: target is immutable
                  rule: self == oldSelf
            required:
            - target
            type: object
            x-kubernetes-validations:
            - message: exactly one of backupName or source must be set
              rule: has(self.backupName) != has(self.source)
          status:
            description: RestoreStatus is the observed state of a Restore.
            properties:
              completionTime:
                format: date-time
                type: string
              files:
                description: Files restored.
                format: int64
                type: integer
              jobName:
                type: string
              message:
                type: string
              phase:
                description: RestorePhase is the lifecycle phase of a Restore.
                type: string
              pvcCreated:
                description: PVCCreated is true when the target PVC was created by
                  this Restore.
                type: boolean
              startTime:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
