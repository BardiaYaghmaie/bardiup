    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BackupConfig schedules backups of PVCs in its namespace and enforces
          a retention policy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BackupConfigSpec defines which PVCs to back up, when, where
              to, and how long to keep the results.
            properties:
              excludes:
                description: |-
                  Excludes are glob patterns (path.Match syntax) of paths, relative to the volume root, to skip.
                  A pattern matching a directory skips its whole subtree. Example: ["lost+found", "cache/*", "*.tmp"].
                items:
                  type: string
                type: array
              failedBackupsHistoryLimit:
                default: 3
                description: FailedBackupsHistoryLimit is how many failed backups
                  per PVC are kept for inspection.
                format: int32
                minimum: 0
                type: integer
              job:
                description: Job customises the data mover Jobs.
                properties:
                  activeDeadlineSeconds:
                    default: 21600
                    description: ActiveDeadlineSeconds bounds how long a single backup
                      or restore may run.
                    format: int64
                    minimum: 60
                    type: integer
                  backoffLimit:
                    default: 2
                    description: BackoffLimit is the number of retries before the
                      Job is marked failed.
                    format: int32
                    minimum: 0
                    type: integer
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector for the mover pod. Ignored when the
