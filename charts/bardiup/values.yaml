image:
  repository: ghcr.io/bardiayaghmaie/bardiup
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Run 2 replicas for faster failover; only the leader reconciles.
replicaCount: 1

# Log verbosity: info, debug, or an integer (higher is noisier).
logLevel: info

resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  annotations: {}

# Aggregate Bardiup permissions into the built-in admin, edit and view ClusterRoles so that
# namespace owners can manage their own BackupConfigs, Backups and Restores.
aggregateToDefaultRoles: true

metrics:
  enabled: true
  port: 8080
  serviceMonitor:
    # Requires the Prometheus Operator CRDs.
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    # Requires the Prometheus Operator CRDs.
    enabled: false
    labels: {}
    # Alert when a PVC has had no successful backup for this many hours.
    staleAfterHours: 26
